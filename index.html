<script id="prGlassFrag" type="x-shader/x-fragment">
precision mediump float;
uniform vec2 uRes;
uniform vec2 uTexRes;
uniform float uRadius;
uniform float uTime;
uniform sampler2D uTex;
vec2 coverUV(vec2 uv){
  vec2 s = uRes, i = uTexRes;
  if (i.x < 1.0 || i.y < 1.0) return uv;
  float rs = s.x / s.y, ri = i.x / i.y;
  vec2 ns = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
  vec2 off = (rs < ri ? vec2((ns.x - s.x) * 0.5, 0.0) : vec2(0.0, (ns.y - s.y) * 0.5)) / ns;
  return uv * s / ns + off;
}
float sdRound(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}
void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = frag / uRes;
  vec2 p = frag - uRes * 0.5;
  vec2 hs = uRes * 0.5;
  float d = sdRound(p, hs, uRadius);
  float inside = 1.0 - smoothstep(-1.5, 1.5, d);
  if (inside <= 0.001) { gl_FragColor = vec4(0.0); return; }
  float dist = -d;
  float edge = 1.0 - clamp(dist / 30.0, 0.0, 1.0);
  vec2 e = vec2(2.0, 0.0);
  float gx = sdRound(p + e.xy, hs, uRadius) - sdRound(p - e.xy, hs, uRadius);
  float gy = sdRound(p + e.yx, hs, uRadius) - sdRound(p - e.yx, hs, uRadius);
  vec2 g = normalize(vec2(gx, gy) + 1e-6);
  float wob = sin((frag.x + frag.y) * 0.02 + uTime * 1.5) * 0.5;
  float disp = (edge * edge * 34.0) + wob * edge * 5.0;
  vec2 base = coverUV(uv);
  vec2 mag = coverUV((uv - 0.5) * 0.9 + 0.5);
  vec2 suv = mix(base, mag, 0.5) + g * disp / uRes;
  vec3 col = vec3(0.0);
  float tot = 0.0;
  for (int i = -2; i <= 2; i++) for (int j = -2; j <= 2; j++) {
    vec2 o = vec2(float(i), float(j)) * 1.6 / uRes;
    col += texture2D(uTex, suv + o).rgb; tot += 1.0;
  }
  col /= tot;
  col = mix(col, col * vec3(1.0, 0.7, 0.76), 0.18);
  col *= 0.8;
  float rim = smoothstep(4.0, 0.0, abs(dist - 2.5));
  vec2 L = normalize(vec2(-0.5, 0.9));
  float lit = clamp(dot(g, L), 0.0, 1.0);
  col += rim * lit * 0.55 + rim * 0.08;
  col += vec3(0.55, 0.06, 0.12) * rim * lit;
  gl_FragColor = vec4(col, inside * 0.96);
}

<script type="module">
import * as THREE from './assets/three.module.js';

const vertexShader = `
varying vec2 vUv;
uniform float uTime;
uniform float mouse;
uniform float uEnableWaves;
void main() {
    vUv = uv;
    float time = uTime * 5.;
    float waveFactor = uEnableWaves;
    vec3 transformed = position;
    transformed.x += sin(time + position.y) * 0.5 * waveFactor;
    transformed.y += cos(time + position.z) * 0.15 * waveFactor;
    transformed.z += sin(time + position.x) * waveFactor;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
}
`;
const fragmentShader = `
varying vec2 vUv;
uniform float mouse;
uniform float uTime;
uniform sampler2D uTexture;
void main() {
    float time = uTime;
    vec2 pos = vUv;
    float r = texture2D(uTexture, pos + cos(time * 2. - time + pos.x) * .01).r;
    float g = texture2D(uTexture, pos + tan(time * .5 + pos.x - time) * .01).g;
    float b = texture2D(uTexture, pos - cos(time * 2. + time + pos.y) * .01).b;
    float a = texture2D(uTexture, pos).a;
    gl_FragColor = vec4(r, g, b, a);

`;

const PX_RATIO = window.devicePixelRatio || 1;
const FONT = "'JetBrains Mono', monospace";

class AsciiFilter {
    constructor(renderer, { fontSize, fontFamily, charset, invert } = {}) {
        this.renderer = renderer;

        this.domElement.style.position = 'absolute';
        this.domElement.style.top = '0';
        this.domElement.style.left = '0';
        this.domElement.style.width = '100%';
        this.domElement.style.height = '100%';
        this.pre = document.createElement('pre');
        this.domElement.appendChild(this.pre);
        this.canvas = document.createElement('canvas');
        this.context = this.canvas.getContext('2d');
        this.domElement.appendChild(this.canvas);
        this.deg = 0;
        this.invert = invert ?? true;
        this.fontSize = fontSize ?? 12;
        this.fontFamily = fontFamily ?? FONT;
        this.charset = charset ?? " .'\`^\",:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

        this.rows = Math.floor(this.height / this.fontSize);

        this.pre.style.fontFamily = this.fontFamily;
        this.pre.style.fontSize = `${this.fontSize}px`;
        this.pre.style.margin = '0'; this.pre.style.padding = '0';
        this.pre.style.lineHeight = '1em';
        this.pre.style.position = 'absolute';

class CanvasTxt {
    constructor(txt, { fontSize = 200, fontFamily = FONT, color = '#fdf9f3' } = {}) {

            vertexShader, fragmentShader, transparent: true,

        this.scene.add(this.mesh);

    setRenderer() {
        this.renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        this.renderer.setPixelRatio(1);
        this.renderer.setClearColor(0x000000, 0);
        this.filter = new AsciiFilter(this.renderer, { fontFamily: FONT, fontSize: this.asciiFontSize, invert: true });
        this.container.appendChild(this.filter.domElement);
        this.setSize(this.width, this.height);
        this.container.addEventListener('mousemove', this.onMouseMove);
        this.container.addEventListener('touchmove', this.onMouseMove);
    }
    setSize(w, h) {
        this.width = w; this.height = h;
        this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
        this.filter.setSize(w, h);
        this.center = { x: w / 2, y: h / 2 };

    load() { this.animate(); }
    onMouseMove(evt) {
        const e = evt.touches ? evt.touches[0] : evt;
        const b = this.container.getBoundingClientRect();

    animate() {
        const frame = () => { this.animationFrameId = requestAnimationFrame(frame); this.render(); };

        const time = new Date().getTime() * 0.001;

        this.texture.needsUpdate = true;
        this.mesh.material.uniforms.uTime.value = Math.sin(time);
        this.updateRotation();
        this.filter.render(this.scene, this.camera);
    }
    updateRotation() {
        const x = mapRange(this.mouse.y, 0, this.height, 0.5, -0.5);
        const y = mapRange(this.mouse.x, 0, this.width, -0.5, 0.5);
        this.mesh.rotation.x += (x - this.mesh.rotation.x) * 0.05;
        this.mesh.rotation.y += (y - this.mesh.rotation.y) * 0.05;
    }
}
