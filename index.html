<style>
:root {

}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #050304;

    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }
::selection { background: var(--accent); color: #fff; }

#bgv {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; pointer-events: none;
    filter: saturate(1.05) brightness(0.9);
}
#glass { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.tint { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 40%, transparent 40%, rgba(5,2,3,0.5) 100%),
                linear-gradient(180deg, rgba(80,6,16,0.12), transparent 40%, rgba(5,2,3,0.35)); }

.lg { position: relative; isolation: isolate; border-radius: 26px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55), 0 2px 18px rgba(255,45,70,0.14); }
.lg::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    backdrop-filter: blur(9px) saturate(150%); -webkit-backdrop-filter: blur(9px) saturate(150%);
    background: rgba(18,6,9,0.14);
}
.lg::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 46%, rgba(255,45,70,0.06));
    box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.5), inset -1px -1px 1px rgba(255,255,255,0.14), inset 0 0 40px rgba(255,45,70,0.05);
    border: 1px solid rgba(255,255,255,0.16);
}
.lg > * { position: relative; z-index: 2; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .lg::before { background: rgba(18,8,10,0.55); }
}
.pane { position: relative; border-radius: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.16), inset -1px -1px 0 rgba(0,0,0,0.16);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

.enter { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(5,3,4,0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);

.enter:hover .enter-inner { transform: translateY(-4px); }
.enter .halo { width: 96px; height: 96px; margin: 0 auto 26px; border-radius: 50%;

.enter .lead { font-family: var(--mono); font-size: 0.86rem; letter-spacing: 0.42em; text-transform: uppercase;

.pr-body { flex: 1; min-width: 0; }

.eq span:nth-child(2) { animation-delay: 0.2s; } .eq span:nth-child(3) { animation-delay: 0.4s; } .eq span:nth-child(4) { animation-delay: 0.15s; }

.social.s-discord { --bc: #98a2ff; --bc-glow: rgba(88,101,242,0.42); }

.mute { position: fixed; bottom: 18px; right: 18px; z-index: 30; width: 42px; height: 42px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 0.9rem;
    background: rgba(20,10,12,0.5); border: 1px solid rgba(255,255,255,0.12);

    opacity: 0; visibility: hidden; transition: opacity 0.4s, transform 0.18s, color 0.18s, border-color 0.18s; }
body.entered .mute { opacity: 1; visibility: visible; }
.mute:hover { color: var(--accent); border-color: rgba(255,45,70,0.4); transform: scale(1.07); }

.foot { text-align: center; margin-top: 20px; font-family: var(--mono); font-size: 0.66rem; color: var(--mute); letter-spacing: 0.04em; }

@media (max-width: 420px) {
    .card { padding: 26px 20px 22px; }

}
@media (prefers-reduced-motion: reduce) {
    .pfp-ring, .presence.spotify .pr-art, .eq span { animation: none !important; }
}
</style>

<script id="frag" type="x-shader/x-fragment">
precision mediump float;
uniform vec3 iResolution;
uniform vec4 iMouse;
uniform vec2 iTexRes;
uniform sampler2D iChannel0;
vec2 coverUV(vec2 uv){
  vec2 s = iResolution.xy;
  vec2 i = iTexRes;
  if (i.x < 1.0 || i.y < 1.0) return uv;
  float rs = s.x / s.y;
  float ri = i.x / i.y;
  vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
  vec2 offset = (rs < ri ? vec2((newSize.x - s.x) * 0.5, 0.0) : vec2(0.0, (newSize.y - s.y) * 0.5)) / newSize;
  return uv * s / newSize + offset;
}
void main(){
  vec2 fragCoord = gl_FragCoord.xy;
  vec2 uv = fragCoord / iResolution.xy;
  vec2 mouse = iMouse.xy;
  if (length(mouse) < 1.0) mouse = iResolution.xy * 0.5;
  vec2 m2 = uv - mouse / iResolution.xy;
  float roundedBox = pow(abs(m2.x * iResolution.x / iResolution.y), 6.0) + pow(abs(m2.y), 6.0);
  float rb1 = clamp((1.0 - roundedBox * 9000.0) * 8.0, 0.0, 1.0);
  float rb2 = clamp((0.95 - roundedBox * 8600.0) * 16.0, 0.0, 1.0) - clamp((0.9 - roundedBox * 8600.0) * 16.0, 0.0, 1.0);
  float rb3 = clamp((1.5 - roundedBox * 10000.0) * 2.0, 0.0, 1.0) - clamp((1.0 - roundedBox * 10000.0) * 2.0, 0.0, 1.0);
  float transition = smoothstep(0.0, 1.0, rb1 + rb2);
  if (transition <= 0.0) { gl_FragColor = vec4(0.0); return; }
  vec2 lens = ((uv - 0.5) * (1.0 - roundedBox * 4600.0) + 0.5);
  vec4 col = vec4(0.0);
  float total = 0.0;
  for (float x = -4.0; x <= 4.0; x++) {
    for (float y = -4.0; y <= 4.0; y++) {
      vec2 off = vec2(x, y) * 0.5 / iResolution.xy;
      col += texture2D(iChannel0, coverUV(off + lens));
      total += 1.0;
    }
  }
  col /= total;
  float gradient = clamp((clamp(m2.y, 0.0, 0.2) + 0.1) / 2.0, 0.0, 1.0) + clamp((clamp(-m2.y, -1000.0, 0.2) * rb3 + 0.1) / 2.0, 0.0, 1.0);
  vec3 rim = vec3(rb2) * vec3(0.4, 0.06, 0.12);
  vec4 lighting = clamp(col + vec4(rb1) * gradient + vec4(rb2) * 0.3, 0.0, 1.0);
  gl_FragColor = vec4(lighting.rgb + rim, transition);
}
</script>

<script>
'use strict';
document.getElementById('yr').textContent = new Date().getFullYear();

(function () {
    var el = document.getElementById('views');
    var base = 'https://api.counterapi.dev/v1/kayaz-bio-x7q/views';
    var counted = sessionStorage.getItem('kv_counted');
    var url = counted ? base + '/' : base + '/up';
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
        if (d && typeof d.count === 'number') { el.textContent = d.count.toLocaleString(); sessionStorage.setItem('kv_counted', '1'); }
        else el.textContent = '—';
    }).catch(function () { el.textContent = '—'; });
})();

(function () {
    if (window.matchMedia('(pointer: coarse)').matches) return;
    var wrap = document.querySelector('.card-wrap');
    document.addEventListener('mousemove', function (e) {
        var rx = (e.clientY / window.innerHeight - 0.5) * -5;
        var ry = (e.clientX / window.innerWidth - 0.5) * 5;
        wrap.style.transform = 'perspective(1200px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    });
})();

var video = document.getElementById('bgv');
(function () {
    var canvas = document.getElementById('glass');
    if (window.matchMedia('(pointer: coarse)').matches) { canvas.style.display = 'none'; return; }
    var gl = canvas.getContext('webgl', { premultipliedAlpha: false, alpha: true });
    if (!gl) { canvas.style.display = 'none'; return; }
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    var vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }');
    gl.compileShader(vs);
    var fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, document.getElementById('frag').textContent);
    gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) { canvas.style.display = 'none'; return; }
    var prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var p = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(p);
    gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);

    var uRes = gl.getUniformLocation(prog, 'iResolution');
    var uMouse = gl.getUniformLocation(prog, 'iMouse');
    var uTex = gl.getUniformLocation(prog, 'iChannel0');
    var uTexRes = gl.getUniformLocation(prog, 'iTexRes');

    var mouse = [window.innerWidth / 2, window.innerHeight / 2];
    window.addEventListener('mousemove', function (e) { mouse = [e.clientX, window.innerHeight - e.clientY]; });

    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 0);

    var ready = false;
    function render() {
        if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, tex);
            try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); ready = true; } catch (e) {}
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT);
        if (ready) {
            gl.uniform3f(uRes, canvas.width, canvas.height, 1.0);
            gl.uniform4f(uMouse, mouse[0], mouse[1], 0, 0);
            gl.uniform2f(uTexRes, video.videoWidth || 1920, video.videoHeight || 1080);
            gl.uniform1i(uTex, 0);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        requestAnimationFrame(render);
    }
    render();
})();

var audio = document.getElementById('audio');
audio.volume = 0.55;
function fmt(s) { s = Math.floor(s || 0); var m = Math.floor(s / 60); var x = s % 60; return m + ':' + (x < 10 ? '0' : '') + x; }

var muteIcon = document.getElementById('muteIcon');
document.getElementById('mute').addEventListener('click', function () {
    audio.muted = !audio.muted;
    muteIcon.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
});

var entered = false;
function doEnter() {
    if (entered) return; entered = true;
    document.getElementById('enter').classList.add('gone');
    document.body.classList.add('entered');
    video.play().catch(function () {});
    audio.play().catch(function () {});
}
document.getElementById('enter').addEventListener('click', doEnter);

var userId = '747411610389446747';
var statusColors = { online: '#3ba55d', idle: '#faa61a', dnd: '#ff2d46', offline: '#8a777b' };
var spState = null;
var statusMeta = {
    online:  { icon: 'fa-solid fa-circle-check', label: 'Online',          sub: 'available — dm me' },
    idle:    { icon: 'fa-solid fa-moon',         label: 'Idle',            sub: 'away from keyboard' },
    dnd:     { icon: 'fa-solid fa-ban',          label: 'Do Not Disturb',  sub: 'busy right now' },
    offline: { icon: 'fa-solid fa-power-off',    label: 'Offline',         sub: 'not around right now' }
};
var gameLogos = [
    { m: 'rainbow six', src: 'r6-logo.png' }
];
function setArt(url) { var a = document.getElementById('prArt'), ic = document.getElementById('prIcon'); a.src = url; a.style.display = 'block'; ic.style.display = 'none'; }
function setIcon(html, color) {
    var a = document.getElementById('prArt'), ic = document.getElementById('prIcon');
    ic.innerHTML = html; ic.style.display = 'flex'; a.style.display = 'none';
    if (color) ic.style.color = color; else ic.style.removeProperty('color');
}
function gameArtUrl(game) {
    if (game.assets && game.assets.large_image) {
        var img = game.assets.large_image;
        if (img.indexOf('mp:external/') === 0) return 'https://media.discordapp.net/' + img.replace('mp:', '');
        if (img.indexOf('spotify:') === 0) return 'https://i.scdn.co/image/' + img.replace('spotify:', '');
        if (game.application_id) return 'https://cdn.discordapp.com/app-assets/' + game.application_id + '/' + img + '.png';
    }
    var name = (game.name || '').toLowerCase();
    for (var i = 0; i < gameLogos.length; i++) if (name.indexOf(gameLogos[i].m) >= 0) return gameLogos[i].src;
    return null;
}
function applyPresence(data) {
    var card = document.getElementById('presence');
    var kind = document.getElementById('prKind'), title = document.getElementById('prTitle'), sub = document.getElementById('prSub');
    card.classList.remove('spotify', 'gaming'); spState = null;
    var st = data.discord_status || 'offline';
    var custom = (data.activities || []).find(function (a) { return a.type === 4; });
    var customText = '';
    if (custom) {
        var emoji = custom.emoji && custom.emoji.name && !custom.emoji.id ? custom.emoji.name + ' ' : '';
        if (custom.state) customText = emoji + custom.state;
    }

    if (data.listening_to_spotify && data.spotify) {
        var sp = data.spotify;
        card.classList.add('spotify');
        kind.innerHTML = '<span class="live"></span> listening on spotify';
        title.textContent = sp.song || '';
        sub.textContent = (sp.artist || '').replace(/;/g, ', ');
        if (sp.album_art_url) setArt(sp.album_art_url); else setIcon('<i class="fa-brands fa-spotify"></i>', '#1db954');
        if (sp.timestamps) { spState = { start: sp.timestamps.start, end: sp.timestamps.end }; updateSp(); }
        return;
    }

    var game = (data.activities || []).find(function (a) { return a.type === 0 || a.type === 2 || a.type === 3 || a.type === 5; });
    if (game) {
        card.classList.add('gaming');
        var verb = game.type === 2 ? 'listening to' : game.type === 3 ? 'watching' : 'playing';
        kind.innerHTML = '<span class="live"></span> ' + verb;
        title.textContent = game.name || '';
        sub.textContent = game.details || game.state || customText || 'in game';
        var url = gameArtUrl(game);
        if (url) setArt(url); else setIcon('<i class="fa-solid fa-gamepad"></i>', '#ff8f6b');
        return;
    }

    var m = statusMeta[st] || statusMeta.offline;
    setIcon('<i class="' + m.icon + '"></i>', null);
    if (customText) {
        kind.innerHTML = '<span class="live"></span> ' + m.label;
        title.textContent = customText;
        sub.textContent = m.sub;
        return;
    }
    kind.innerHTML = '<span class="live"></span> status';
    title.textContent = m.label;
    sub.textContent = m.sub;
}
function updateSp() {
    if (!spState) return;
    var now = Date.now(), total = spState.end - spState.start, played = Math.max(0, Math.min(total, now - spState.start));
    document.getElementById('prFill').style.width = (total > 0 ? (played / total) * 100 : 0) + '%';
    document.getElementById('prCur').textContent = fmt(played / 1000);
    document.getElementById('prDur').textContent = fmt(total / 1000);
}
setInterval(updateSp, 1000);
function fetchStatus() {
    fetch('https://api.lanyard.rest/v1/users/' + userId).then(function (r) { return r.json(); }).then(function (json) {
        var data = json.data; if (!data) return;
        if (data.discord_user && data.discord_user.avatar) {
            document.getElementById('pfp').src = 'https://cdn.discordapp.com/avatars/' + userId + '/' + data.discord_user.avatar + '.png?size=256';
        }
        var st = data.discord_status || 'offline';
        var col = statusColors[st] || statusColors.offline;
        document.documentElement.style.setProperty('--status', col);
        document.getElementById('pfpStatus').style.background = col;
        document.getElementById('pfpStatus').style.boxShadow = '0 0 10px ' + col;
        applyPresence(data);
    }).catch(function () {});
}
fetchStatus();
setInterval(fetchStatus, 15000);
</script>
