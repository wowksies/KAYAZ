<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>kayaz — games</title>
<meta name="description" content="kayaz games">
<meta name="theme-color" content="#ff2d46">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --accent: #e0293f;
    --accent-2: #ff5d6e;
    --bg: #0a0709;
    --surface: #120d0f;
    --surface-2: #171012;
    --line: #241a1d;
    --text: #f8f2f3;
    --dim: #e4dadd;
    --mute: #b7a5a9;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #2b1f22; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.bg { position: fixed; inset: 0; z-index: -2; background: var(--bg); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

header { position: sticky; top: 0; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); }
.hd { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.16rem; letter-spacing: -0.02em; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.brand b { color: var(--accent); }
.hd-right { display: flex; align-items: center; gap: 8px; }
.ic { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 1rem;
    background: var(--surface-2); border: 1px solid var(--line); transition: color 0.15s, border-color 0.15s, background 0.15s; }
.ic:hover { color: var(--bc, var(--accent)); border-color: #33262a; background: #1d1417; }
.ic.s-discord { --bc: #98a2ff; } .ic.s-tiktok { --bc: #34ffee; } .ic.s-github { --bc: #fff; }
.ic.home { color: var(--accent); }

.page-head { display: flex; align-items: baseline; gap: 12px; padding: 26px 0 4px; }
.page-head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.pcount { font-family: var(--mono); font-size: 0.74rem; color: var(--mute); }

.tools { display: flex; align-items: center; gap: 10px; margin: 22px 0 18px; flex-wrap: wrap; }
.search { flex: 1; min-width: 220px; position: relative; }
.search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--mute); font-size: 0.9rem; }
.search input { width: 100%; padding: 12px 16px 12px 40px; border-radius: 9px; font-family: var(--sans); font-size: 0.94rem;
    color: var(--text); background: var(--surface); border: 1px solid var(--line); outline: none; transition: border-color 0.15s; }
.search input::placeholder { color: var(--mute); }
.search input:focus { border-color: var(--accent); }
.count { font-family: var(--mono); font-size: 0.76rem; color: var(--mute); white-space: nowrap; }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex-shrink: 0; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; color: var(--mute);
    background: var(--surface); border: 1px solid var(--line); transition: 0.15s; white-space: nowrap; }
.cat:hover { color: var(--text); }
.cat.on { color: #fff; background: var(--accent); border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 14px; padding-bottom: 60px; }
.tile { border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--line);
    transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%; }
.tile:hover { border-color: #3a2a2e; background: var(--surface-2); }
.tile-img { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #120a0c; }
.tile-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.tile:hover .tile-img img { transform: scale(1.03); }
.kb-tag { position: absolute; top: 7px; right: 7px; z-index: 2; font-family: var(--mono); font-size: 0.55rem;
    padding: 3px 6px; border-radius: 5px; color: #fff; background: rgba(12,7,9,0.85); border: 1px solid var(--line); letter-spacing: 0.06em; }
.tile-body { padding: 11px 12px 13px; }
.tile-name { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-cat { font-family: var(--mono); font-size: 0.65rem; color: var(--mute); margin-top: 3px; }
.empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--mute); }
.empty i { font-size: 2rem; color: var(--line); margin-bottom: 12px; }

footer { border-top: 1px solid var(--line); padding: 26px 0 34px; text-align: center;
    font-family: var(--mono); font-size: 0.72rem; color: var(--mute); }
footer a { color: var(--dim); } footer a:hover { color: var(--accent); }

/* player */
.player { position: fixed; inset: 0; z-index: 100; background: #000; display: none; flex-direction: column; }
.player.on { display: flex; }
.pbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top)); background: var(--surface);
    border-bottom: 1px solid var(--line); flex-shrink: 0; }
.pbar-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 9px; font-size: 0.84rem; font-weight: 700;
    color: var(--text); background: var(--surface-2); border: 1px solid var(--line); transition: 0.15s; white-space: nowrap; }
.pbtn:hover { background: #241a1d; border-color: #3a2a2e; }
.pbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.pwrap { flex: 1; position: relative; background: #000; min-height: 0; }
.pwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.ploading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--mute); font-family: var(--mono); font-size: 0.82rem; background: #000; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
    animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.note { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5;
    padding: 9px 15px; border-radius: 9px; font-size: 0.78rem; color: var(--dim);
    background: var(--surface); border: 1px solid var(--line); max-width: 90%; text-align: center;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.note.on { opacity: 1; }


.gate { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none;
    align-items: center; justify-content: center; padding: 24px; }
.gate.on { display: flex; }
.gate-box { width: 100%; max-width: 370px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 30px 26px; }
.gate-box .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--accent); margin-bottom: 16px; }
.gate-box h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
.gate-box p { color: var(--mute); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }
.gate-box input { width: 100%; padding: 13px 15px; border-radius: 9px; font-family: var(--mono);
    font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); outline: none; margin-bottom: 12px; }
.gate-box input:focus { border-color: var(--accent); }
.gate-box button { width: 100%; padding: 12px; border-radius: 9px; font-size: 0.92rem; font-weight: 700;
    color: #fff; background: var(--accent); border: 1px solid var(--accent); cursor: pointer; }
.gate-box button:disabled { opacity: 0.55; cursor: not-allowed; }
.gate-msg { font-size: 0.82rem; color: #ff8b98; margin-bottom: 12px; min-height: 1.1em; display: none; }
.gate-msg.on { display: block; }
.gate-foot { margin-top: 18px; font-size: 0.75rem; color: var(--mute); text-align: center; }
.gate-foot a { color: var(--dim); }
body.locked { overflow: hidden; }
main.wrap, header, footer { transition: opacity 0.3s; }
body.locked main.wrap, body.locked footer { opacity: 0; pointer-events: none; }

@media (max-width: 640px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 11px; }
    .hd { height: 60px; }
    .brand { font-size: 1.02rem; }
    .ic { width: 34px; height: 34px; font-size: 0.9rem; }
    .pbar-title { font-size: 0.85rem; }
    .pbtn { padding: 8px 11px; font-size: 0.78rem; }
    .pbtn .lbl { display: none; }
}
</style>
</head>
<body>
<div class="bg"></div>

<div class="gate" id="gate">
    <div class="gate-box">
        <div class="mark"><i class="fa-solid fa-lock"></i></div>
        <h2>invite only</h2>
        <p>you need an invite code to play. one code works on one browser.</p>
        <div class="gate-msg" id="gateMsg"></div>
        <input id="gateCode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="20">
        <button id="gateBtn">unlock</button>
        <div class="gate-foot">need one? <a href="https://discord.com/users/747411610389446747" target="_blank" rel="noopener">ask kayaz</a></div>
    </div>
</div>

<header>
    <div class="wrap hd">
        <a href="/" class="brand"><span class="dot"></span>kayaz<b>.</b><span style="color:var(--mute);font-weight:600;font-size:0.9rem;">/games</span></a>
        <div class="hd-right">
            <a href="https://discord.com/users/747411610389446747" target="_blank" rel="noopener" class="ic s-discord" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="https://www.tiktok.com/@k.a.yaz" target="_blank" rel="noopener" class="ic s-tiktok" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://github.com/wowksies" target="_blank" rel="noopener" class="ic s-github" title="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="/" class="ic home" title="back to kayaz.xyz"><i class="fa-solid fa-house"></i></a>
        </div>
    </div>
</header>

<main class="wrap">
    <div class="page-head">
        <h1>games</h1>
        <span class="pcount"><span id="total">0</span> total</span>
    </div>

    <div class="tools">
        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="q" placeholder="search games..." autocomplete="off">
        </div>
        <div class="count"><span id="shown">0</span> shown</div>
    </div>

    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
</main>

<footer>&copy; <span id="yr"></span> kayaz &middot; <a href="/">kayaz.xyz</a></footer>

<div class="player" id="player">
    <div class="pbar">
        <button class="pbtn" onclick="closeGame()"><i class="fa-solid fa-arrow-left"></i> <span class="lbl">back</span></button>
        <div class="pbar-title" id="pTitle">game</div>
        <div style="display:flex;gap:8px;">
            <button class="pbtn" id="padBtn" onclick="togglePad()"><i class="fa-solid fa-gamepad"></i> <span class="lbl">controls</span></button>
            <button class="pbtn" onclick="goFull()"><i class="fa-solid fa-expand"></i> <span class="lbl">full</span></button>
        </div>
    </div>
    <div class="pwrap" id="pwrap">
        <iframe id="frame" allowfullscreen allow="autoplay; fullscreen; gamepad; pointer-lock"
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-modals"></iframe>
        <div class="ploading" id="loading"><div class="spin"></div><span>loading...</span></div>
        <div class="note" id="note"></div>
    </div>
</div>

<script>
'use strict';
document.getElementById('yr').textContent = new Date().getFullYear();
var GAMES = [];
var grid = document.getElementById('grid'), catsEl = document.getElementById('cats'),
    q = document.getElementById('q'), shownEl = document.getElementById('shown');
var activeCat = 'All';

function buildCats() {
    catsEl.innerHTML = '';
    var cats = ['All'].concat(Object.keys(GAMES.reduce(function (a, g) { a[g.cat] = 1; return a; }, {})).sort());
    cats.forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'cat' + (c === activeCat ? ' on' : '');
        b.textContent = c.toLowerCase();
        b.onclick = function () {
            activeCat = c;
            [].forEach.call(catsEl.children, function (x) { x.classList.remove('on'); });
            b.classList.add('on');
            render();
        };
        catsEl.appendChild(b);
    });
}

function render() {
    var term = q.value.trim().toLowerCase();
    var list = GAMES.filter(function (g) {
        return (activeCat === 'All' || g.cat === activeCat) && (!term || g.title.toLowerCase().indexOf(term) >= 0);
    });
    shownEl.textContent = list.length;
    grid.innerHTML = '';
    if (!list.length) {
        grid.innerHTML = '<div class="empty"><i class="fa-solid fa-ghost"></i><div>nothing found</div></div>';
        return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (g) {
        var b = document.createElement('button');
        b.className = 'tile';
        b.innerHTML = '<div class="tile-img">' + (g.kb ? '<span class="kb-tag">keys</span>' : '') +
            '<img loading="lazy" src="' + g.img + '" alt="" onerror="this.style.opacity=0"></div>' +
            '<div class="tile-body"><div class="tile-name"></div><div class="tile-cat"></div></div>';
        b.querySelector('.tile-name').textContent = g.title;
        b.querySelector('.tile-cat').textContent = g.cat.toLowerCase();
        b.onclick = function () { openGame(g); };
        frag.appendChild(b);
    });
    grid.appendChild(frag);
}
q.addEventListener('input', render);
render();

var TKU = 'kz_pass', DEV = 'kz_dev';
function deviceId() {
    var d = localStorage.getItem(DEV);
    if (!d) {
        d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(36).slice(2);
        localStorage.setItem(DEV, d);
    }
    return d;
}
var userToken = localStorage.getItem(TKU) || '';
function apiGet(path) {
    return fetch('/api/' + path, { headers: userToken ? { authorization: 'Bearer ' + userToken } : {} })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, data: j }; }); });
}
function lock(on) {
    document.body.classList.toggle('locked', on);
    document.getElementById('gate').classList.toggle('on', on);
}
function gateErr(t) {
    var m = document.getElementById('gateMsg');
    m.textContent = t || '';
    m.classList.toggle('on', Boolean(t));
}
function loadGames() {
    return apiGet('games').then(function (r) {
        if (!r.ok) { lock(true); if (r.status === 503) gateErr('access is not set up yet'); return; }
        GAMES = (r.data.games || []).map(function (g) {
            return { title: g.title, cat: g.cat || 'Game', kb: Boolean(g.kb), img: g.img || '', url: g.url };
        });
        document.getElementById('total').textContent = GAMES.length;
        buildCats();
        render();
        lock(false);
    });
}
document.getElementById('gateBtn').addEventListener('click', function () {
    var b = this, code = document.getElementById('gateCode').value;
    if (!code.trim()) return gateErr('enter your code');
    b.disabled = true; b.textContent = 'checking...';
    gateErr('');
    fetch('/api/redeem', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code: code, device: deviceId() })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); })
      .then(function (r) {
        b.disabled = false; b.textContent = 'unlock';
        if (!r.ok) return gateErr(r.data.error || 'that code did not work');
        userToken = r.data.token;
        localStorage.setItem(TKU, userToken);
        loadGames();
      }).catch(function () { b.disabled = false; b.textContent = 'unlock'; gateErr('network error'); });
});
document.getElementById('gateCode').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('gateBtn').click();
});

lock(true);
if (userToken) {
    apiGet('session').then(function (r) {
        if (r.ok && r.data.ok) loadGames();
        else { localStorage.removeItem(TKU); userToken = ''; }
    }).catch(function () {});
}


var isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
var frame = document.getElementById('frame'), player = document.getElementById('player'),
    loading = document.getElementById('loading'), note = document.getElementById('note'),
    padBtn = document.getElementById('padBtn');
var token = 0, padOn = false, padAvailable = false;

function showNote(msg, ms) {
    note.textContent = msg; note.classList.add('on');
    clearTimeout(showNote.t);
    showNote.t = setTimeout(function () { note.classList.remove('on'); }, ms || 3200);
}

function openGame(g) {
    var my = ++token;
    document.getElementById('pTitle').textContent = g.title;
    player.classList.add('on');
    document.body.style.overflow = 'hidden';
    loading.style.display = 'flex';
    padOn = false; padAvailable = false;
    padBtn.classList.remove('on');
    padBtn.style.display = isTouch ? '' : 'none';
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';

    fetch(g.url).then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.text();
    }).then(function (html) {
        if (my !== token) return;
        var base = g.url.replace(/[^/]*$/, '');
        var doc = html;
        if (!/<base\s/i.test(doc)) doc = doc.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
        if (!/<head/i.test(doc)) doc = '<head><base href="' + base + '"></head>' + doc;
        doc += '\n<script>' + PAD_SRC + '<\/script>';
        padAvailable = true;
        frame.srcdoc = doc;
        frame.onload = function () {
            if (my !== token) return;
            loading.style.display = 'none';
            if (isTouch) { setPad(true); showNote('touch controls on — tap the controls button to hide'); }
        };
    }).catch(function () {
        if (my !== token) return;
        padAvailable = false;
        frame.removeAttribute('srcdoc');
        frame.src = g.url;
        frame.onload = function () {
            if (my !== token) return;
            loading.style.display = 'none';
            if (isTouch) showNote('this game loads direct, on-screen controls are not available for it');
        };
    });
}

function closeGame() {
    token++;
    player.classList.remove('on');
    document.body.style.overflow = '';
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
}

function setPad(on) {
    padOn = on;
    padBtn.classList.toggle('on', on);
    if (frame.contentWindow) frame.contentWindow.postMessage({ kayaz: 'pad', on: on }, '*');
}
function togglePad() {
    if (!padAvailable) { showNote('on-screen controls are not available for this game'); return; }
    setPad(!padOn);
}
function goFull() {
    var el = document.getElementById('pwrap');
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (r) r.call(el).catch(function () {});
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && player.classList.contains('on')) closeGame(); });
