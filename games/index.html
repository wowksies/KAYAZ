<style>
:root {

    --mute: #b7a5a9;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #0b0709; }
::-webkit-scrollbar-thumb { background: #2a1519; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.bg { position: fixed; inset: 0; z-index: -2; background:
    radial-gradient(120% 90% at 50% -10%, #2a0810 0%, #12060a 45%, #070406 100%); }
.bg::after { content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, #000 30%, transparent 100%); }
.glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.5; z-index: -1; pointer-events: none; }
.g1 { width: 40vw; height: 40vw; background: radial-gradient(circle, #ff2d46, transparent 65%); top: -12%; left: -8%; }
.g2 { width: 34vw; height: 34vw; background: radial-gradient(circle, #b3111f, transparent 65%); bottom: -14%; right: -6%; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

header { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%); background: rgba(9,5,7,0.72);
    border-bottom: 1px solid rgba(255,255,255,0.09); }
.hd { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.16rem; letter-spacing: -0.02em; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.brand b { color: var(--accent); }
.hd-right { display: flex; align-items: center; gap: 8px; }
.ic { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 1rem;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.16);
    transition: transform 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s; }
.ic:hover { transform: translateY(-2px); color: var(--bc, var(--accent)); border-color: color-mix(in srgb, var(--bc, var(--accent)) 55%, transparent);
    box-shadow: 0 8px 20px color-mix(in srgb, var(--bc, var(--accent)) 28%, transparent); }
.ic.s-discord { --bc: #98a2ff; } .ic.s-tiktok { --bc: #34ffee; } .ic.s-github { --bc: #fff; }
.ic.home { color: var(--accent); }

.hero { padding: 46px 0 26px; text-align: center; }
.hero .kicker { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.68rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
    padding: 6px 14px; border-radius: 100px; background: rgba(255,45,70,0.1); border: 1px solid rgba(255,45,70,0.28); }
.hero h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; margin: 16px 0 10px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--mute); font-size: 0.98rem; }

.tools { display: flex; align-items: center; gap: 10px; margin: 22px 0 18px; flex-wrap: wrap; }
.search { flex: 1; min-width: 220px; position: relative; }
.search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--mute); font-size: 0.9rem; }
.search input { width: 100%; padding: 13px 16px 13px 40px; border-radius: 14px; font-family: var(--sans); font-size: 0.94rem;
    color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);

.search input::placeholder { color: var(--mute); }
.search input:focus { border-color: rgba(255,45,70,0.55); box-shadow: 0 0 0 3px rgba(255,45,70,0.14); }
.count { font-family: var(--mono); font-size: 0.76rem; color: var(--mute); white-space: nowrap; }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex-shrink: 0; padding: 8px 15px; border-radius: 100px; font-size: 0.82rem; font-weight: 600; color: var(--mute);

.cat:hover { color: var(--text); }
.cat.on { color: #fff; background: linear-gradient(135deg, var(--accent), #b3111f); border-color: transparent;
    box-shadow: 0 5px 16px rgba(255,45,70,0.34); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 14px; padding-bottom: 60px; }
.tile { border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 1px 1px 0 rgba(255,255,255,0.12);

.tile:hover { transform: translateY(-5px); border-color: rgba(255,45,70,0.5); box-shadow: 0 14px 30px rgba(255,45,70,0.22); }
.tile-img { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #120a0c; }
.tile-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.tile:hover .tile-img img { transform: scale(1.06); }
.tile-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(8,4,5,0.75)); }
.kb-tag { position: absolute; top: 8px; right: 8px; z-index: 2; font-family: var(--mono); font-size: 0.55rem;

.tile-body { padding: 11px 12px 13px; }
.tile-name { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-cat { font-family: var(--mono); font-size: 0.65rem; color: var(--mute); margin-top: 3px; }
.empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--mute); }

footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 26px 0 34px; text-align: center;

.note.on { opacity: 1; }

    .pbtn .lbl { display: none; }

var grid = document.getElementById('grid'), catsEl = document.getElementById('cats'),
    q = document.getElementById('q'), shownEl = document.getElementById('shown');
document.getElementById('total').textContent = GAMES.length;
var activeCat = 'All';

var cats = ['All'].concat(Object.keys(GAMES.reduce(function (a, g) { a[g.cat] = 1; return a; }, {})).sort());
cats.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'cat' + (c === 'All' ? ' on' : '');
    b.textContent = c.toLowerCase();
    b.onclick = function () {
        activeCat = c;
        [].forEach.call(catsEl.children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        render();
    };
    catsEl.appendChild(b);
});

function render() {
    var term = q.value.trim().toLowerCase();
    var list = GAMES.filter(function (g) {
        return (activeCat === 'All' || g.cat === activeCat) && (!term || g.title.toLowerCase().indexOf(term) >= 0);
    });
    shownEl.textContent = list.length;
    grid.innerHTML = '';
    if (!list.length) {
        grid.innerHTML = '<div class="empty"><i class="fa-solid fa-ghost"></i><div>nothing found</div></div>';
        return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (g) {
        var b = document.createElement('button');
        b.className = 'tile';
        b.innerHTML = '<div class="tile-img">' + (g.kb ? '<span class="kb-tag">keys</span>' : '') +
            '<img loading="lazy" src="' + g.img + '" alt="" onerror="this.style.opacity=0"></div>' +
            '<div class="tile-body"><div class="tile-name"></div><div class="tile-cat"></div></div>';
        b.querySelector('.tile-name').textContent = g.title;
        b.querySelector('.tile-cat').textContent = g.cat.toLowerCase();
        b.onclick = function () { openGame(g); };
        frag.appendChild(b);
    });
    grid.appendChild(frag);
}
q.addEventListener('input', render);
render();

var isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
var frame = document.getElementById('frame'), player = document.getElementById('player'),
    loading = document.getElementById('loading'), note = document.getElementById('note'),
    padBtn = document.getElementById('padBtn');
var token = 0, padOn = false, padAvailable = false;

function showNote(msg, ms) {
    note.textContent = msg; note.classList.add('on');
    clearTimeout(showNote.t);
    showNote.t = setTimeout(function () { note.classList.remove('on'); }, ms || 3200);
}

function openGame(g) {
    var my = ++token;
    document.getElementById('pTitle').textContent = g.title;
    player.classList.add('on');
    document.body.style.overflow = 'hidden';
    loading.style.display = 'flex';
    padOn = false; padAvailable = false;
    padBtn.classList.remove('on');
    padBtn.style.display = isTouch ? '' : 'none';
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';

    fetch(g.url).then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.text();
    }).then(function (html) {
        if (my !== token) return;
        var base = g.url.replace(/[^/]*$/, '');
        var doc = html;
        if (!/<base\s/i.test(doc)) doc = doc.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
        if (!/<head/i.test(doc)) doc = '<head><base href="' + base + '"></head>' + doc;
        doc += '\n<script>' + PAD_SRC + '<\/script>';
        padAvailable = true;
        frame.srcdoc = doc;
        frame.onload = function () {
            if (my !== token) return;
            loading.style.display = 'none';
            if (isTouch) { setPad(true); showNote('touch controls on — tap the controls button to hide'); }
        };
    }).catch(function () {
        if (my !== token) return;
        padAvailable = false;
        frame.removeAttribute('srcdoc');
        frame.src = g.url;
        frame.onload = function () {
            if (my !== token) return;
            loading.style.display = 'none';
            if (isTouch) showNote('this game loads direct, on-screen controls are not available for it');
        };
    });
}

function closeGame() {
    token++;
    player.classList.remove('on');
    document.body.style.overflow = '';
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
}

function setPad(on) {
    padOn = on;
    padBtn.classList.toggle('on', on);
    if (frame.contentWindow) frame.contentWindow.postMessage({ kayaz: 'pad', on: on }, '*');
}
function togglePad() {
    if (!padAvailable) { showNote('on-screen controls are not available for this game'); return; }
    setPad(!padOn);
}
function goFull() {
    var el = document.getElementById('pwrap');
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (r) r.call(el).catch(function () {});
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && player.classList.contains('on')) closeGame(); });
